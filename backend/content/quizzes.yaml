# Astro Kitty quiz bank.
# Each part of the game has its own quiz. A quiz shows 5 questions, chosen to
# revisit the skills a kid finds hard (see astrokitty/adaptive.py).
#
# type: choice    -> options + answer (index of the right option, from 0)
# type: truefalse -> answer: true / false
# type: order     -> options listed in the RIGHT order; the game shuffles them
# Every question needs English + Bangla text, an explanation and a NASA source.
# `python -m astrokitty.build --check` rejects anything missing.

parts:
  academy:
    title: {en: "Earth Academy quiz", bn: "আর্থ একাডেমি কুইজ"}
    after: {en: "You finished the five science labs!", bn: "তুমি পাঁচটা বিজ্ঞান ল্যাব শেষ করেছ!"}
  flight:
    title: {en: "Fly to Mars quiz", bn: "মঙ্গলে উড়াল কুইজ"}
    after: {en: "You flew all the way to Mars!", bn: "তুমি মঙ্গল পর্যন্ত উড়ে গেছ!"}
  training:
    title: {en: "Astronaut training quiz", bn: "নভোচারী প্রশিক্ষণ কুইজ"}
    after: {en: "You finished astronaut training!", bn: "তুমি নভোচারী প্রশিক্ষণ শেষ করেছ!"}
  base:
    title: {en: "Mars base quiz", bn: "মঙ্গল ঘাঁটি কুইজ"}
    after: {en: "You kept the Mars base alive!", bn: "তুমি মঙ্গল ঘাঁটি বাঁচিয়ে রেখেছ!"}
  kittycode:
    title: {en: "Kitty Code quiz", bn: "কিটি কোড কুইজ"}
    after: {en: "You drove the rover with code!", bn: "তুমি কোড দিয়ে রোভার চালিয়েছ!"}
  mars3d:
    title: {en: "Mars explorer quiz", bn: "মঙ্গল অভিযাত্রী কুইজ"}
    after: {en: "You explored Mars in 3D!", bn: "তুমি থ্রিডিতে মঙ্গল ঘুরে দেখেছ!"}

questions:
  # ---------------- Earth Academy ----------------
  - id: ac-gravity-1
    part: academy
    skill: gravity
    level: 1
    type: choice
    q: {en: "On Mars, you would feel…", bn: "মঙ্গলে তোমার মনে হবে তুমি…"}
    options:
      - {en: "Lighter than on Earth", bn: "পৃথিবীর চেয়ে হালকা", emoji: "🪶"}
      - {en: "Heavier than on Earth", bn: "পৃথিবীর চেয়ে ভারী", emoji: "🪨"}
      - {en: "Exactly the same", bn: "একদম একই রকম", emoji: "⚖️"}
    answer: 0
    explain: {en: "Mars gravity is only about 38% of Earth's. You could jump almost three times higher!", bn: "মঙ্গলের মাধ্যাকর্ষণ পৃথিবীর মাত্র ৩৮%। তুমি প্রায় তিন গুণ উঁচুতে লাফাতে পারবে!"}
    source: https://science.nasa.gov/mars/facts/
  - id: ac-gravity-2
    part: academy
    skill: gravity
    level: 2
    type: truefalse
    q: {en: "With no air, a feather and a hammer dropped together land at the same time.", bn: "বাতাস না থাকলে, একসাথে ফেলা পালক আর হাতুড়ি একই সময়ে মাটিতে পড়ে।"}
    answer: true
    explain: {en: "Air slows the feather. With no air, gravity pulls both the same. Astronaut Dave Scott showed this on the Moon in 1971!", bn: "বাতাস পালককে ধীর করে। বাতাস না থাকলে মাধ্যাকর্ষণ দুটোকেই সমান টানে। ১৯৭১ সালে নভোচারী ডেভ স্কট চাঁদে এটা দেখিয়েছিলেন!"}
    source: https://nssdc.gsfc.nasa.gov/planetary/lunar/apollo_15_feather_drop.html
  - id: ac-float-1
    part: academy
    skill: training
    level: 1
    type: choice
    q: {en: "Where on Earth do astronauts practise space walks?", bn: "নভোচারীরা পৃথিবীতে মহাকাশে হাঁটার অনুশীলন কোথায় করেন?"}
    options:
      - {en: "In a giant swimming pool", bn: "বিশাল একটা সুইমিং পুলে", emoji: "🏊"}
      - {en: "On a tall mountain", bn: "উঁচু পাহাড়ে", emoji: "🏔️"}
      - {en: "In a freezer", bn: "ফ্রিজের ভেতরে", emoji: "🧊"}
    answer: 0
    explain: {en: "Floating in water feels a bit like being weightless, so NASA trains astronauts in a huge pool.", bn: "পানিতে ভাসলে কিছুটা ওজনহীন মনে হয়, তাই নাসা বিশাল পুলে নভোচারীদের প্রশিক্ষণ দেয়।"}
    source: https://www.nasa.gov/johnson/neutral-buoyancy-laboratory/
  - id: ac-plants-1
    part: academy
    skill: life-support
    level: 1
    type: choice
    q: {en: "What do plants need to grow in a space garden?", bn: "মহাকাশ বাগানে গাছ বড় হতে কী লাগে?"}
    options:
      - {en: "Water, light and nutrients", bn: "পানি, আলো আর পুষ্টি", emoji: "🌱"}
      - {en: "Only darkness", bn: "শুধু অন্ধকার", emoji: "🌑"}
      - {en: "Rocket fuel", bn: "রকেটের জ্বালানি", emoji: "⛽"}
    answer: 0
    explain: {en: "Plants need water, light and nutrients. In space, LED lights often take the place of sunlight.", bn: "গাছের পানি, আলো আর পুষ্টি লাগে। মহাকাশে প্রায়ই সূর্যের আলোর বদলে এলইডি আলো ব্যবহার হয়।"}
    source: https://www.nasa.gov/exploration-research-and-technology/growing-plants-in-space/
  - id: ac-air-1
    part: academy
    skill: life-support
    level: 2
    type: choice
    q: {en: "Electricity can split water into two gases. Which one do we breathe?", bn: "বিদ্যুৎ পানিকে দুটো গ্যাসে ভাগ করতে পারে। কোনটা আমরা শ্বাসে নিই?"}
    options:
      - {en: "Oxygen", bn: "অক্সিজেন", emoji: "🫁"}
      - {en: "Hydrogen", bn: "হাইড্রোজেন", emoji: "🎈"}
    answer: 0
    explain: {en: "Water is made of hydrogen and oxygen. The space station splits water to make oxygen for the crew.", bn: "পানি হাইড্রোজেন আর অক্সিজেন দিয়ে তৈরি। মহাকাশ স্টেশন পানি ভেঙে নভোচারীদের জন্য অক্সিজেন বানায়।"}
    source: https://www.nasa.gov/reference/environmental-control-and-life-support-systems-eclss/
  - id: ac-air-2
    part: academy
    skill: life-support
    level: 2
    type: truefalse
    q: {en: "A carbon dioxide filter makes new oxygen.", bn: "কার্বন ডাই-অক্সাইড ফিল্টার নতুন অক্সিজেন বানায়।"}
    answer: false
    explain: {en: "A CO₂ filter cleans the air by removing carbon dioxide. Making oxygen needs a different machine.", bn: "CO₂ ফিল্টার কার্বন ডাই-অক্সাইড সরিয়ে বাতাস পরিষ্কার করে। অক্সিজেন বানাতে আলাদা যন্ত্র লাগে।"}
    source: https://www.nasa.gov/reference/environmental-control-and-life-support-systems-eclss/
  - id: ac-rover-1
    part: academy
    skill: rovers
    level: 1
    type: choice
    q: {en: "Why do rover drivers plan the route before driving?", bn: "রোভার চালানোর আগে চালকেরা কেন পথ পরিকল্পনা করেন?"}
    options:
      - {en: "To avoid rocks and stay safe", bn: "পাথর এড়িয়ে নিরাপদ থাকতে", emoji: "🪨"}
      - {en: "To go as fast as possible", bn: "যত দ্রুত সম্ভব যেতে", emoji: "🏎️"}
      - {en: "Because rovers like music", bn: "কারণ রোভার গান পছন্দ করে", emoji: "🎵"}
    answer: 0
    explain: {en: "There is no mechanic on Mars! Drivers check every step so the rover does not get stuck or hurt.", bn: "মঙ্গলে কোনো মেকানিক নেই! রোভার যেন আটকে না যায় বা ভেঙে না যায়, তাই চালকেরা প্রতিটি ধাপ পরীক্ষা করেন।"}
    source: https://science.nasa.gov/mission/mars-2020-perseverance/
  - id: ac-order-1
    part: academy
    skill: life-support
    level: 3
    type: order
    q: {en: "Put the space garden steps in order.", bn: "মহাকাশ বাগানের ধাপগুলো সাজাও।"}
    options:
      - {en: "Plant the seed", bn: "বীজ লাগাও", emoji: "🌰"}
      - {en: "Give water and light", bn: "পানি আর আলো দাও", emoji: "💧"}
      - {en: "The plant grows", bn: "গাছ বড় হয়", emoji: "🌿"}
      - {en: "Eat a fresh lunch", bn: "তাজা দুপুরের খাবার খাও", emoji: "🥗"}
    explain: {en: "Seed, care, growth, food! Astronauts on the space station have eaten lettuce they grew themselves.", bn: "বীজ, যত্ন, বেড়ে ওঠা, খাবার! মহাকাশ স্টেশনের নভোচারীরা নিজেদের ফলানো লেটুস খেয়েছেন।"}
    source: https://www.nasa.gov/exploration-research-and-technology/growing-plants-in-space/

  # ---------------- Fly to Mars ----------------
  - id: fl-time-1
    part: flight
    skill: orbits
    level: 1
    type: choice
    q: {en: "About how long does a trip to Mars take?", bn: "মঙ্গলে যেতে মোটামুটি কত সময় লাগে?"}
    options:
      - {en: "About 7 months", bn: "প্রায় ৭ মাস", emoji: "📅"}
      - {en: "About 7 days", bn: "প্রায় ৭ দিন", emoji: "🗓️"}
      - {en: "About 7 hours", bn: "প্রায় ৭ ঘণ্টা", emoji: "⏰"}
    answer: 0
    explain: {en: "Perseverance launched in July 2020 and landed in February 2021: about 7 months.", bn: "পারসিভিয়ারেন্স ২০২০ সালের জুলাইয়ে রওনা দিয়ে ২০২১ সালের ফেব্রুয়ারিতে নামে: প্রায় ৭ মাস।"}
    source: https://www.jpl.nasa.gov/news/press_kits/mars_2020/landing/mission/
  - id: fl-window-1
    part: flight
    skill: orbits
    level: 2
    type: choice
    q: {en: "How often does the best launch window to Mars come?", bn: "মঙ্গলে যাওয়ার সবচেয়ে ভালো সুযোগ কত দিন পরপর আসে?"}
    options:
      - {en: "About every 26 months", bn: "প্রায় প্রতি ২৬ মাসে", emoji: "🪐"}
      - {en: "Every week", bn: "প্রতি সপ্তাহে", emoji: "📆"}
      - {en: "Every 100 years", bn: "প্রতি ১০০ বছরে", emoji: "⌛"}
    answer: 0
    explain: {en: "Earth and Mars line up well about every 26 months. That is when rockets leave for Mars.", bn: "পৃথিবী আর মঙ্গল প্রায় প্রতি ২৬ মাসে ভালোভাবে সারিতে আসে। তখনই রকেট মঙ্গলে রওনা দেয়।"}
    source: https://science.nasa.gov/mars/facts/
  - id: fl-aim-1
    part: flight
    skill: orbits
    level: 3
    type: truefalse
    q: {en: "A rocket aims at where Mars WILL BE when it arrives, not where Mars is at launch.", bn: "রকেট মঙ্গলের দিকে নয়, বরং পৌঁছানোর সময় মঙ্গল যেখানে থাকবে সেদিকে তাক করে।"}
    answer: true
    explain: {en: "Mars keeps moving around the Sun, so the spacecraft heads to where Mars will be months later.", bn: "মঙ্গল সূর্যের চারপাশে ঘুরতেই থাকে, তাই মহাকাশযান যায় মাসখানেক পরে মঙ্গল যেখানে থাকবে সেখানে।"}
    source: https://www.jpl.nasa.gov/news/press_kits/mars_2020/landing/mission/
  - id: fl-red-1
    part: flight
    skill: mars-facts
    level: 1
    type: choice
    q: {en: "Why is Mars red?", bn: "মঙ্গল লাল কেন?"}
    options:
      - {en: "Rusty dust", bn: "মরিচা ধরা ধুলো", emoji: "🟤"}
      - {en: "It is very hot", bn: "এটা খুব গরম", emoji: "🔥"}
      - {en: "Red paint", bn: "লাল রং", emoji: "🎨"}
    answer: 0
    explain: {en: "Mars dust has iron in it that has rusted. That rusty dust makes the whole planet look red.", bn: "মঙ্গলের ধুলোয় লোহা আছে, যাতে মরিচা ধরেছে। এই মরিচা ধরা ধুলোর জন্য পুরো গ্রহটা লাল দেখায়।"}
    source: https://science.nasa.gov/mars/facts/
  - id: fl-moons-1
    part: flight
    skill: mars-facts
    level: 2
    type: choice
    q: {en: "How many moons does Mars have?", bn: "মঙ্গলের কয়টা চাঁদ আছে?"}
    options:
      - {en: "Two", bn: "দুটো", emoji: "🌘"}
      - {en: "One", bn: "একটা", emoji: "🌕"}
      - {en: "None", bn: "একটাও না", emoji: "🚫"}
    answer: 0
    explain: {en: "Mars has two small moons called Phobos and Deimos.", bn: "মঙ্গলের দুটো ছোট চাঁদ আছে: ফোবোস আর ডেইমোস।"}
    source: https://science.nasa.gov/mars/facts/
  - id: fl-delay-1
    part: flight
    skill: orbits
    level: 2
    type: truefalse
    q: {en: "A radio message from Mars reaches Earth instantly.", bn: "মঙ্গল থেকে রেডিও বার্তা সাথে সাথে পৃথিবীতে পৌঁছে যায়।"}
    answer: false
    explain: {en: "Even at the speed of light, a message takes from about 3 to 22 minutes, depending on where the planets are.", bn: "আলোর গতিতেও একটা বার্তা পৌঁছাতে ৩ থেকে ২২ মিনিট লাগে, গ্রহগুলো কোথায় আছে তার ওপর নির্ভর করে।"}
    source: https://science.nasa.gov/mars/facts/
  - id: fl-order-1
    part: flight
    skill: orbits
    level: 1
    type: order
    q: {en: "Put the trip to Mars in order.", bn: "মঙ্গল যাত্রার ধাপগুলো সাজাও।"}
    options:
      - {en: "Launch", bn: "উৎক্ষেপণ", emoji: "🚀"}
      - {en: "Cruise through space", bn: "মহাকাশে ভ্রমণ", emoji: "✨"}
      - {en: "Enter the atmosphere", bn: "বায়ুমণ্ডলে প্রবেশ", emoji: "🔥"}
      - {en: "Land on Mars", bn: "মঙ্গলে অবতরণ", emoji: "🪂"}
    explain: {en: "Launch, cruise, entry, landing! The landing part is so fast it is called 'seven minutes of terror'.", bn: "উৎক্ষেপণ, ভ্রমণ, প্রবেশ, অবতরণ! অবতরণ এত দ্রুত হয় যে একে বলে 'সাত মিনিটের আতঙ্ক'।"}
    source: https://www.jpl.nasa.gov/news/press_kits/mars_2020/landing/mission/

  # ---------------- Astronaut training ----------------
  - id: tr-dust-1
    part: training
    skill: power
    level: 1
    type: choice
    q: {en: "Why did we brush the solar panels?", bn: "আমরা সোলার প্যানেল কেন ব্রাশ করেছিলাম?"}
    options:
      - {en: "Dust blocks the sunlight", bn: "ধুলো সূর্যের আলো আটকে দেয়", emoji: "☀️"}
      - {en: "To make them shiny for photos", bn: "ছবির জন্য চকচকে করতে", emoji: "📸"}
      - {en: "Panels like being tickled", bn: "প্যানেল সুড়সুড়ি পছন্দ করে", emoji: "🪶"}
    answer: 0
    explain: {en: "Dust covers solar panels and makes less electricity. NASA's InSight lander slowly lost power because of dust.", bn: "ধুলো সোলার প্যানেল ঢেকে দেয়, ফলে বিদ্যুৎ কম তৈরি হয়। নাসার ইনসাইট ল্যান্ডার ধুলোর জন্য ধীরে ধীরে শক্তি হারিয়েছিল।"}
    source: https://science.nasa.gov/resource/insights-power-generation-after-landing-and-spring-2022/
  - id: tr-storm-1
    part: training
    skill: weather
    level: 2
    type: truefalse
    q: {en: "Some dust storms on Mars can cover the whole planet.", bn: "মঙ্গলের কিছু ধুলিঝড় পুরো গ্রহ ঢেকে ফেলতে পারে।"}
    answer: true
    explain: {en: "Yes! Most storms are small, but every few years one grows big enough to wrap around all of Mars.", bn: "হ্যাঁ! বেশিরভাগ ঝড় ছোট, কিন্তু কয়েক বছর পরপর একটা ঝড় এত বড় হয় যে পুরো মঙ্গল ঢেকে ফেলে।"}
    source: https://science.nasa.gov/mars/facts/
  - id: tr-shelter-1
    part: training
    skill: weather
    level: 2
    type: choice
