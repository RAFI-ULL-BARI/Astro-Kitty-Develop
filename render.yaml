# One-click deploy on Render: the game and the Python backend together.
# Set ANTHROPIC_API_KEY in the Render dashboard to switch on AI Dhrubo.
services:
  - type: web
    name: astro-kitty
    runtime: docker
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: astro-kitty-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
databases:
  - name: astro-kitty-db
    plan: free
